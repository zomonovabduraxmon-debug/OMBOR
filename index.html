<!DOCTYPE html>
<html lang="ru"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">

<meta name="theme-color" content="#1a2338">
<link rel="manifest" href="./manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  :root{
    --ink:#1c2430;
    --paper:#eef1f2;
    --panel:#ffffff;
    --line:#d7dde1;
    --line-soft:#e7ebed;
    --primary:#2b3a55;
    --primary-light:#44597e;
    --primary-dark:#1a2338;
    --teal:#1f8a70;
    --teal-soft:#e2f2ee;
    --amber:#b9791f;
    --amber-soft:#faf1de;
    --red:#a8402a;
    --red-soft:#f9e7e2;
    --muted:#6b7480;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(rgba(238,241,242,0.94), rgba(238,241,242,0.94)),
      url('./bg-icon.png') left bottom / 340px auto no-repeat,
      var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
  }
  ::selection{background:var(--teal-soft);}
  a{color:inherit;}
  button{font-family:inherit;font-size:inherit;cursor:pointer;}
  input,select{font-family:inherit;font-size:inherit;}

  .topbar{
    background:#dcecfb;
    color:#16202c;
    padding:18px 28px 0 28px;
    border-bottom:1px solid #c3dcf4;
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;
    display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  .brand{display:flex;align-items:center;gap:12px;transition:opacity .15s ease;}
  .brand:hover{opacity:.82;}
  .brand:focus-visible{outline:2px solid #2f6fed;outline-offset:4px;border-radius:10px;}
  .brand-logo{
    height:64px;width:auto;flex-shrink:0;display:block;
    background:#fff;border-radius:12px;padding:6px 12px;
    animation: logo-flip 10s ease-in-out infinite;
    transform-style:preserve-3d;
  }
  @keyframes logo-flip{
    0%{ transform:rotateY(0deg); }
    10%{ transform:rotateY(360deg); }
    100%{ transform:rotateY(360deg); }
  }
  .brand-text{display:flex;flex-direction:column;gap:1px;}
  .brand-mark{
    font-family:var(--serif); font-size:22px; letter-spacing:0.5px; font-weight:700;
    color:#16202c;
  }
  .brand-sub{ color:#3c4a5c; font-size:12.5px; letter-spacing:0.3px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .sync-pill{
    font-size:11.5px; color:#28405c; background:rgba(255,255,255,0.55);
    border:1px solid rgba(22,32,44,0.14); padding:4px 10px; border-radius:20px;
  }
  .auth-btn{
    background:transparent;color:#16202c;border:1px solid rgba(22,32,44,.25);
    padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;
  }
  .auth-btn:hover{background:rgba(22,32,44,.06);}
  .sync-pill[data-kind="offline"], .sync-pill[data-kind="error"]{color:#a8402a;}
  .sync-pill[data-kind="syncing"], .sync-pill[data-kind="pending"], .sync-pill[data-kind="auth"]{color:#8a5a12;}
  .tabs{
    max-width:1180px;margin:20px auto 0 auto;
    display:flex; border-bottom:1px solid rgba(22,32,44,0.14);
  }
  .tab-btn{
    background:none;border:none;color:#4c5b6e;
    padding:20px 4px; font-size:25px; font-weight:600; letter-spacing:0.2px;
    border-bottom:4px solid transparent; transition:color .15s;
    flex:1; text-align:center;
  }
  .tab-btn:hover{color:#16202c;}
  .tab-btn.active{color:#16202c;border-bottom-color:var(--teal);font-weight:700;}

  .wrap{max-width:1180px;margin:0 auto;padding:28px;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .toolbar h1{font-family:var(--serif);font-size:22px;margin:0;font-weight:700;}
  .toolbar .desc{color:var(--muted);font-size:13px;margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--primary); color:#fff; border:1px solid var(--primary);
    padding:9px 16px; border-radius:3px; font-size:13.5px; font-weight:600;
    letter-spacing:0.2px;
  }
  .btn:hover{background:var(--primary-light);}
  .btn.secondary{background:var(--panel);color:var(--primary);border-color:var(--line);}
  .btn.secondary:hover{background:var(--paper);}
  .btn.danger{background:var(--panel);color:var(--red);border-color:var(--red-soft);}
  .btn.danger:hover{background:var(--red-soft);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px 22px;}
  .stat-card .num{font-family:var(--serif);font-size:36px;font-weight:700;}
  .stat-card .lbl{color:var(--muted);font-size:14px;margin-top:4px;letter-spacing:.2px;}
  .stat-card.warn .num{color:var(--amber);}
  .stat-card.crit .num{color:var(--red);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;}
  .panel + .panel{margin-top:16px;}
  .panel-head{
    padding:12px 16px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .panel-head h2{font-family:var(--serif);font-size:16px;margin:0;font-weight:700;}
  .panel-head h3{font-size:13.5px;margin:0;font-weight:700;color:var(--primary);}
  .panel-body{padding:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}

  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
  th{
    text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.4px;
    border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap;
  }
  td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .num-col{text-align:right;font-family:var(--mono);white-space:nowrap;}
  .code-col{font-family:var(--mono);color:var(--primary);}
  tbody tr:hover{background:#fafbfb;}
  .row-clickable{cursor:pointer;}

  .badge{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;
  }
  .badge.ok{background:var(--teal-soft);color:var(--teal);}
  .badge.warn{background:var(--amber-soft);color:var(--amber);}
  .badge.crit{background:var(--red-soft);color:var(--red);}
  .badge.neutral{background:var(--line-soft);color:var(--muted);}

  .material-badge{
    display:inline-block;max-width:220px;background:#eaf0fd;color:#3757c9;
    border-radius:10px;padding:5px 10px;font-size:11.5px;font-weight:600;
    line-height:1.35;white-space:normal;word-break:break-word;
  }

  .gauge{width:120px;height:8px;background:var(--line-soft);border-radius:2px;overflow:hidden;display:flex;}
  .gauge-seg{height:100%;}
  .gauge-wrap{display:flex;align-items:center;gap:8px;}
  .gauge-pct{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:38px;text-align:right;}

  .empty{padding:36px 16px;text-align:center;color:var(--muted);}
  .empty .big{font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:6px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;letter-spacing:.2px;}
  .field input, .field select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(43,58,85,.08);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .item-row-grid{
    display:grid;grid-template-columns: 28px 1.8fr 1.4fr 1.1fr 0.9fr 1fr 1fr 32px;
    gap:8px;align-items:center;padding:6px 0;
  }
  .item-row-grid input, .item-row-grid select{padding:6px 8px;font-size:12.5px;}
  .item-row-grid .idx{color:var(--muted);font-family:var(--mono);font-size:12px;text-align:center;}
  .remove-x{
    background:none;border:none;color:var(--muted);font-size:16px;width:28px;height:28px;border-radius:3px;
  }
  .remove-x:hover{background:var(--red-soft);color:var(--red);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,26,36,0.45);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow:auto;z-index:2000;
  }
  .modal{
    background:var(--panel);border-radius:5px;max-width:880px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h2{font-family:var(--serif);font-size:18px;margin:0;}
  .modal-body{padding:20px;max-height:70vh;overflow:auto;-webkit-overflow-scrolling:touch;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--muted);}

  .subtle-note{font-size:12px;color:var(--muted);margin-top:6px;}
  .stepper{display:flex;gap:6px;margin-bottom:18px;}
  .step-pill{
    flex:1;text-align:center;padding:7px 0;border-radius:3px;background:var(--paper);color:var(--muted);
    font-size:12px;font-weight:700;letter-spacing:.3px;border:1px solid var(--line);
  }
  .step-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .step-pill.done{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-soft);}

  .dropzone{
    border:2px dashed var(--line);border-radius:4px;padding:30px;text-align:center;color:var(--muted);
    background:var(--paper);
  }
  .dropzone.drag{border-color:var(--primary-light);background:#eef2f7;}
  .dropzone input[type=file]{display:none;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100; opacity:0; transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  select.map-select{font-size:12px;}
  .mismatch{color:var(--red);}
  .search-input{padding:8px 10px;border:1px solid var(--line);border-radius:3px;width:240px;}
  .dashboard-controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .dashboard-select{padding:8px 30px 8px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);min-width:150px;}
  .warehouse-summary{
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    background:var(--primary-dark);color:#fff;border-radius:4px;padding:16px 20px;margin-bottom:14px;
  }
  .warehouse-summary .title{font-family:var(--serif);font-size:16px;font-weight:700;}
  .warehouse-summary .hint{font-size:11.5px;color:#aebbcd;margin-top:2px;}
  .warehouse-values{display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
  .warehouse-value{display:flex;align-items:baseline;gap:6px;white-space:nowrap;}
  .warehouse-value strong{font-family:var(--serif);font-size:28px;font-weight:700;}
  .warehouse-value span{font-size:12px;color:#c7d3e2;}
  .badge.accepted{background:var(--teal-soft);color:var(--teal);}
  .badge.completed{background:var(--line-soft);color:#53606e;}
  tfoot td{background:#f7f9fa;border-top:1px solid var(--line);border-bottom:none;font-weight:700;}
  .table-total-label{text-align:right;color:var(--primary);}

  footer{max-width:1180px;margin:0 auto;padding:10px 28px 40px 28px;color:var(--muted);font-size:11.5px;}
  .footer-contacts{
    max-width:1180px;margin:24px auto 0 auto;padding:22px 28px;
    border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .footer-contacts .fc-brand{font-family:var(--serif);font-weight:700;color:var(--primary);font-size:14px;}
  .fc-links{display:flex;gap:22px;flex-wrap:wrap;}
  .fc-social{display:flex;gap:12px;flex-shrink:0;}
  .fc-link{
    display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:13px;font-weight:600;
    text-decoration:none;
  }
  .fc-link:hover{color:var(--primary);}
  .fc-link svg{width:17px;height:17px;flex-shrink:0;}
  .fc-icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    transition:transform .15s, box-shadow .15s;
  }
  .fc-icon-btn:hover{transform:translateY(-2px);}
  .fc-icon-btn svg{width:20px;height:20px;}
  .fc-icon-btn.instagram{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);}
  .fc-icon-btn.telegram{background:#28a8e9;}

  @media (max-width:720px){
    .cards-row{grid-template-columns:repeat(2,1fr);}
    .field-row{grid-template-columns:1fr;}
    .item-row-grid{grid-template-columns: 20px 1.3fr 1.2fr 0.9fr 0.8fr 0.8fr 0.8fr 26px;font-size:11.5px;}
    .dashboard-controls{width:100%;justify-content:stretch;}
    .dashboard-controls .search-input,.dashboard-controls .dashboard-select{width:100%;min-width:0;}
    .warehouse-values{width:100%;justify-content:space-between;gap:12px;}
  }

  @media (max-width:600px){
    html,body{overflow-x:hidden;width:100%;}
    .topbar{padding:14px 14px 0 14px;}
    .topbar-inner{align-items:center;}
    .brand{gap:8px;}
    .brand-logo{height:44px;padding:4px 8px;border-radius:9px;}
    .brand-mark{font-size:16px;}
    .brand-sub{font-size:10.5px;}
    .sync-pill,.auth-btn{font-size:10.5px;padding:3px 8px;}
    .tabs{
      overflow-x:auto;-webkit-overflow-scrolling:touch;
      margin:12px -14px 0 -14px;padding:0 14px;
    }

    .wrap{padding:14px;}
    .toolbar{flex-direction:column;align-items:flex-start;}
    .toolbar .btn{width:100%;justify-content:center;}

    .cards-row{grid-template-columns:1fr 1fr;gap:8px;}
    .stat-card{padding:14px 14px;}
    .stat-card .num{font-size:26px;}

    .warehouse-summary{flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px;}
    .warehouse-values{gap:10px;}
    .warehouse-value strong{font-size:22px;}

    .panel-head{flex-direction:column;align-items:flex-start;gap:8px;}

    .footer-contacts{flex-direction:column;align-items:flex-start;padding:18px 14px;gap:14px;}
    .fc-links{gap:12px;flex-direction:column;}
    .fc-social{gap:10px;}
    .modal-backdrop{padding:0;}
    .modal{max-width:100%;width:100%;min-height:100vh;border-radius:0;}
    .modal-body{padding:14px;max-height:calc(100vh - 116px);}
    .modal-head,.modal-foot{padding:12px 14px;}
    .modal-foot{flex-wrap:wrap;}
    .modal-foot .btn{flex:1;}
  }
</style>

<script>
/* ============================= STATE & STORAGE ============================= */
let state = { permits: [], shipments: [], audits: [] };
let currentTab = 'dashboard';
let isEditorMode = false; // true faqat tizimga kirgan (login qilgan) foydalanuvchi uchun
let dashboardSearch = '';
let dashboardFilter = 'all';
let dashboardSort = 'remaining-desc';
let uploadDraft = null; // holds in-progress upload mapping state
let auditSearch = '';
let shipmentHistorySearch = '';
let editShipmentDraft = null; // { shipmentId, permitId, invoiceNumber, invoiceDate, lines }

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,10); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

function setSyncPill(kind, message){
  const pill = document.getElementById('syncPill');
  if(!pill) return;
  pill.dataset.kind = kind || 'local';
  pill.textContent = message || '';
  if(kind === 'error'){
    pill.style.cursor = 'pointer';
    pill.title = uiT('Нажмите, чтобы повторить попытку');
  }else{
    pill.style.cursor = '';
    pill.title = '';
  }
}

function auditSummary(a){
  const oldD=a.oldData||{}, newD=a.newData||{};
  if(a.action==='create') return uiT('Создано');
  if(a.action==='delete' || a.action==='shipment_delete') return uiT('Удалено');
  if(a.action==='shipment_create') return uiT('Создана отгрузка');
  const changes=[];
  const lang=uiLang();
  const labels={
    number:{ru:'номер',en:'number',uz:'raqam',tr:'numara'},
    date:{ru:'дата',en:'date',uz:'sana',tr:'tarih'},
    items:{ru:'позиций',en:'items',uz:'pozitsiya',tr:'kalem'},
    qty:{ru:'кол-во',en:'qty',uz:'miqdor',tr:'miktar'},
    weight:{ru:'вес',en:'weight',uz:'vazn',tr:'ağırlık'}
  };
  const lab=k=>labels[k][lang]||labels[k].ru;
  if(a.entityType==='permit'){
    if((oldD.number||'')!==(newD.number||'')) changes.push(`${lab('number')}: ${oldD.number||'—'} → ${newD.number||'—'}`);
    if((oldD.date||'')!==(newD.date||'')) changes.push(`${lab('date')}: ${oldD.date||'—'} → ${newD.date||'—'}`);
    const oi=(oldD.items||[]).length, ni=(newD.items||[]).length;
    if(oi!==ni) changes.push(`${lab('items')}: ${oi} → ${ni}`);
    const oq=(oldD.items||[]).reduce((x,i)=>x+(Number(i.qty)||0),0), nq=(newD.items||[]).reduce((x,i)=>x+(Number(i.qty)||0),0);
    const ow=(oldD.items||[]).reduce((x,i)=>x+(Number(i.weight)||0),0), nw=(newD.items||[]).reduce((x,i)=>x+(Number(i.weight)||0),0);
    if(oq!==nq) changes.push(`${lab('qty')}: ${fmt(oq,0)} → ${fmt(nq,0)}`);
    if(Math.abs(ow-nw)>1e-9) changes.push(`${lab('weight')}: ${fmt(ow,2)} → ${fmt(nw,2)} ${uiT('кг')}`);
  }else if(a.entityType==='shipment'){
    const oq=(newD.lines||oldD.lines||[]).reduce((x,i)=>x+(Number(i.qty)||0),0);
    const ow=(newD.lines||oldD.lines||[]).reduce((x,i)=>x+(Number(i.weight)||0),0);
    changes.push(`${lab('qty')}: ${fmt(oq,0)}, ${lab('weight')}: ${fmt(ow,2)} ${uiT('кг')}`);
  }
  return changes.length ? changes.join('; ') : uiT('Данные изменены');
}

/* ============================= CALCULATIONS ============================= */
function itemUsage(permitId, itemId, excludeShipmentId){
  let qty = 0, weight = 0;
  for(const sh of state.shipments){
    if(sh.permitId !== permitId) continue;
    if(excludeShipmentId && sh.id === excludeShipmentId) continue;
    for(const ln of (Array.isArray(sh.lines)?sh.lines:[])){
      if(ln.itemId === itemId){
        qty += Math.max(0, Number(ln.qty)||0);
        weight += Math.max(0, Number(ln.weight)||0);
      }
    }
  }
  return { qty, weight };
}

function itemStatus(item, used){
  const allowedQty = Math.max(0, Number(item.qty)||0);
  const allowedWeight = Math.max(0, Number(item.weight)||0);
  const remQty = allowedQty - used.qty;
  const remWeight = allowedWeight - used.weight;
  const pct = allowedQty ? Math.max(0, remQty) / allowedQty : 0;
  let level = 'ok';
  if(remQty < -1e-9 || remWeight < -1e-9) level = 'over';
  else if(Math.abs(remQty) < 1e-9 || Math.abs(remWeight) < 1e-9) level = 'finished';
  else if(pct <= 0.25) level = 'warn';
  return { remQty, remWeight, pct, level };
}

function permitTotals(permit){
  let allowedQty=0, allowedW=0, usedQty=0, usedW=0;
  for(const it of (permit.items||[])){
    allowedQty += Math.max(0, Number(it.qty)||0);
    allowedW += Math.max(0, Number(it.weight)||0);
    const u = itemUsage(permit.id, it.id);
    usedQty += u.qty; usedW += u.weight;
  }
  return { allowedQty, allowedW, usedQty, usedW, remQty: allowedQty-usedQty, remW: allowedW-usedW };
}

function validateShipmentLines(permit, lines, excludeShipmentId){
  if(!permit || !Array.isArray(permit.items)) return ['Разрешение не найдено'];
  const errors = [];
  const byItem = new Map();

  for(const l of lines){
    const itemId = String(l.itemId||'');
    const qty = Number(l.qty);
    const weight = Number(l.weight);
    if(!itemId) { errors.push('Не указана позиция разрешения'); continue; }
    if(!Number.isFinite(qty) || qty <= 0) { errors.push('Количество должно быть больше 0'); continue; }
    if(!Number.isFinite(weight) || weight < 0) { errors.push('Вес не может быть отрицательным'); continue; }
    const it = permit.items.find(x=>x.id===itemId);
    if(!it) { errors.push('Найдена неизвестная позиция разрешения'); continue; }
    const prev = byItem.get(itemId) || {qty:0, weight:0, name:it.name};
    prev.qty += qty;
    prev.weight += weight;
    byItem.set(itemId, prev);
  }

  for(const [itemId, v] of byItem){
    const it = permit.items.find(x=>x.id===itemId);
    const used = itemUsage(permit.id, itemId, excludeShipmentId);
    const allowedQty = Math.max(0, Number(it.qty)||0);
    const allowedWeight = Math.max(0, Number(it.weight)||0);
    if(used.qty + v.qty > allowedQty + 1e-9){
      errors.push(`${it.name}: превышено количество (остаток ${fmt(Math.max(0, allowedQty-used.qty),2)})`);
    }
    if(used.weight + v.weight > allowedWeight + 1e-9){
      errors.push(`${it.name}: превышен вес (остаток ${fmt(Math.max(0, allowedWeight-used.weight),3)} кг)`);
    }
  }
  return errors;
}

function fmt(n, dec){
  dec = dec===undefined ? 2 : dec;
  n = Number(n)||0;
  let s = n.toFixed(dec);
  if(dec>0) s = s.replace(/\.?0+$/,'').replace(/^$/, '0');
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return parts.join(',');
}

      <h3 style="font-family:var(--serif);font-size:14px;margin:20px 0 8px 0;">Отгрузки по этому разрешению</h3>
      ${shipments.length ? `<table><thead><tr><th>Инвойс</th><th>Дата</th><th>Строк</th><th>Кол-во</th><th>Вес</th><th></th></tr></thead><tbody>${shipRows}</tbody></table>`

    <div class="modal-foot">
      <button class="btn secondary" data-close>Закрыть</button>

/* ============================= PERMIT ADD / EDIT MODAL ============================= */
function blankItem(){ return { id: uid('it'), name:'', material:'', tnved:'', unit:'шт', qty:'', weight:'' }; }

function openPermitModal(permitId){
  const editing = !!permitId;
  const p = editing ? state.permits.find(x=>x.id===permitId) : { id: uid('perm'), number:'', date:'', note:'', items:[blankItem()] };
  const draft = JSON.parse(JSON.stringify(p));

  function itemsHtml(){
    return draft.items.map((it,i)=>`
      <div class="item-row-grid" data-item-row="${it.id}">
        <div class="idx">${i+1}</div>
        <input type="text" placeholder="Наименование товара" value="${escapeAttr(it.name)}" data-field="name">
        <input type="text" placeholder="Мато / material" value="${escapeAttr(it.material||'')}" data-field="material">
        <input type="text" placeholder="ТН ВЭД" value="${escapeAttr(it.tnved)}" data-field="tnved">
        <select data-field="unit">
          <option value="шт" ${it.unit==='шт'?'selected':''}>шт</option>
          <option value="пара" ${it.unit==='пара'?'selected':''}>пара</option>
          <option value="кг" ${it.unit==='кг'?'selected':''}>кг</option>
        </select>
        <input type="number" placeholder="Кол-во" value="${it.qty}" data-field="qty">
        <input type="number" placeholder="Вес, кг" value="${it.weight}" data-field="weight">
        <button class="remove-x" data-remove-item="${it.id}" title="Удалить строку">&times;</button>
      </div>
    `).join('');
  }

  function bodyHtml(){
    return `
      <div class="field-row">
        <div class="field"><label>Номер разрешения</label><input type="text" id="fldNumber" value="${escapeAttr(draft.number)}" placeholder="напр. RC20260001681"></div>
        <div class="field"><label>Дата разрешения</label><input type="date" id="fldDate" value="${draft.date||''}"></div>
      </div>
      <div class="field"><label>Примечание (клиент / бренд, необязательно)</label><input type="text" id="fldNote" value="${escapeAttr(draft.note||'')}" placeholder="напр. ARYANCOM"></div>
      <div style="margin-top:16px;">
        <div class="item-row-grid" style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;">
          <div></div><div>Наименование</div><div>Мато</div><div>ТН ВЭД</div><div>Ед.</div><div>Кол-во</div><div>Вес, кг</div><div></div>
        </div>
        <div id="itemsHost">${itemsHtml()}</div>
        <button class="btn secondary sm" id="btnAddItem" style="margin-top:8px;">+ Добавить позицию</button>
      </div>
    `;
  }

  showModal(`
    <div class="modal-head"><h2>${editing?'Изменить разрешение':'Новое разрешение'}</h2><button class="close-x" data-close>&times;</button></div>
    <div class="modal-body" id="permitModalBody">${bodyHtml()}</div>
    <div class="modal-foot">
      <button class="btn secondary" data-close>Отмена</button>
      <button class="btn" id="btnSavePermit">Сохранить</button>
    </div>
  `);

  function rebindItemRows(){
    document.querySelectorAll('#itemsHost [data-item-row]').forEach(rowEl=>{
      const id = rowEl.dataset.itemRow;
      rowEl.querySelectorAll('[data-field]').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const it = draft.items.find(x=>x.id===id);
          it[inp.dataset.field] = inp.value;
        });
      });
    });
    document.querySelectorAll('[data-remove-item]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(draft.items.length<=1){ toast('Должна остаться хотя бы одна позиция'); return; }
        draft.items = draft.items.filter(x=>x.id!==btn.dataset.removeItem);
        document.getElementById('itemsHost').innerHTML = itemsHtml();
        rebindItemRows();
      });
    });
  }
  rebindItemRows();

  document.getElementById('btnAddItem').addEventListener('click', ()=>{
    draft.items.push(blankItem());
    document.getElementById('itemsHost').innerHTML = itemsHtml();
    rebindItemRows();
  });

  document.getElementById('btnSavePermit').addEventListener('click', async ()=>{
    draft.number = document.getElementById('fldNumber').value.trim();
    draft.date = document.getElementById('fldDate').value;
    draft.note = document.getElementById('fldNote').value.trim();
    if(!draft.number){ toast('Укажите номер разрешения'); return; }
    const duplicatePermit = state.permits.find(x=>x.id!==draft.id && String(x.number||'').trim().toLowerCase()===draft.number.toLowerCase());
    if(duplicatePermit){ toast('Разрешение с таким номером уже существует'); return; }
    draft.items = draft.items.filter(it=>it.name.trim()!=='');
    if(!draft.items.length){ toast('Добавьте хотя бы одну позицию с названием'); return; }
    const invalidItems = [];
    draft.items.forEach(it=>{
      it.qty = Number(it.qty);
      it.weight = Number(it.weight);
      if(!Number.isFinite(it.qty) || it.qty <= 0) invalidItems.push(`${it.name}: количество должно быть больше 0`);
      if(!Number.isFinite(it.weight) || it.weight < 0) invalidItems.push(`${it.name}: вес не может быть отрицательным`);
    });
    if(invalidItems.length){
      alert('Разрешение не сохранено:\n\n'+invalidItems.join('\n'));
      return;
    }

    const idx = state.permits.findIndex(x=>x.id===draft.id);
    const before = idx>=0 ? JSON.parse(JSON.stringify(state.permits[idx])) : null;
    if(idx>=0) state.permits[idx] = draft; else state.permits.push(draft);
    await savePermits();
    await addAudit(idx>=0 ? 'update' : 'create', 'permit', draft.id, draft.number, before, draft);
    closeModal();
    render();
    toast(editing?'Разрешение обновлено':'Разрешение добавлено');
  });
}

async function deletePermit(permitId){
  const hasShip = state.shipments.some(s=>s.permitId===permitId);
  const msg = hasShip
    ? 'У этого разрешения есть отгрузки. Удалить разрешение и все связанные отгрузки?'
    : 'Удалить это разрешение?';
  if(!confirm(msg)) return;
  const oldPermit = state.permits.find(p=>p.id===permitId);
  const deletedShipments = state.shipments.filter(s=>s.permitId===permitId);
  state.permits = state.permits.filter(p=>p.id!==permitId);
  state.shipments = state.shipments.filter(s=>s.permitId!==permitId);
  await savePermits();
  await saveShipments();
  if(oldPermit) await addAudit('delete', 'permit', permitId, oldPermit.number, oldPermit, null);
  for(const sh of deletedShipments) await addAudit('shipment_delete', 'shipment', sh.id, sh.invoiceNumber||sh.id, sh, null);
  render();
  toast('Разрешение удалено');
}

function bindShipmentEvents(){
  const permitSel = document.getElementById('shipPermit');
  if(permitSel) permitSel.addEventListener('change', e=>{ shipmentDraft.permitId = e.target.value; shipmentDraft.lines={}; uploadDraft=null; render(); });
  const modeSel = document.getElementById('shipMode');
  if(modeSel) modeSel.addEventListener('change', e=>{ shipmentDraft.mode = e.target.value; uploadDraft=null; render(); });
  const invNum = document.getElementById('shipInvNum');
  if(invNum) invNum.addEventListener('input', e=>shipmentDraft.invoiceNumber = e.target.value);
  const invDate = document.getElementById('shipInvDate');
  if(invDate) invDate.addEventListener('input', e=>shipmentDraft.invoiceDate = e.target.value);

  document.querySelectorAll('[data-line-qty]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const id = inp.dataset.lineQty;
      shipmentDraft.lines[id] = shipmentDraft.lines[id] || {};
      shipmentDraft.lines[id].qty = inp.value;
    });
  });
  document.querySelectorAll('[data-line-weight]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const id = inp.dataset.lineWeight;
      shipmentDraft.lines[id] = shipmentDraft.lines[id] || {};
      shipmentDraft.lines[id].weight = inp.value;
    });
  });

  const autoW = document.getElementById('btnAutoWeight');
  if(autoW) autoW.addEventListener('click', ()=>{
    document.querySelectorAll('[data-line-qty]').forEach(inp=>{
      const qty = Number(inp.value)||0;
      const perUnit = Number(inp.dataset.perunit)||0;
      const wInput = document.querySelector(`[data-line-weight="${inp.dataset.lineQty}"]`);
      if(wInput && qty>0){ wInput.value = (qty*perUnit).toFixed(3); shipmentDraft.lines[inp.dataset.lineQty] = {qty:inp.value, weight: wInput.value}; }
    });
    toast('Вес пересчитан по среднему весу единицы разрешения');
  });

  const saveBtn = document.getElementById('btnSaveShipment');
  if(saveBtn) saveBtn.addEventListener('click', saveManualShipment);

  bindUploadEvents();
}

async function saveManualShipment(){
  const permit = state.permits.find(p=>p.id===shipmentDraft.permitId);
  if(!permit){ toast('Разрешение не найдено'); return; }

  const lines = Object.entries(shipmentDraft.lines)
    .map(([itemId,v])=>({itemId, qty:Number(v.qty), weight:Number(v.weight)}))
    .filter(l=>Number.isFinite(l.qty) && l.qty>0);

  if(!lines.length){ toast('Введите количество хотя бы по одной позиции'); return; }

  const errors = validateShipmentLines(permit, lines);
  if(errors.length){
    toast('Отгрузка не сохранена: ' + errors[0]);
    alert('Отгрузка не может быть проведена:\n\n' + errors.join('\n'));
    return;
  }

  const newShipment = {
    id: uid('ship'), permitId: permit.id,
    invoiceNumber: shipmentDraft.invoiceNumber, invoiceDate: shipmentDraft.invoiceDate,
    lines
  };
  state.shipments.push(newShipment);
  await saveShipments();
  await addAudit('shipment_create', 'shipment', newShipment.id, newShipment.invoiceNumber||newShipment.id, null, newShipment);
  shipmentDraft = { mode:'manual', permitId: permit.id, invoiceNumber:'', invoiceDate:'', lines:{} };
  render();
  toast('Отгрузка сохранена, остатки обновлены');
}

/* ============================= SHIPMENT HISTORY (barcha yuklamalar) ============================= */
function shipmentLineTotals(sh){
  const lines = Array.isArray(sh.lines) ? sh.lines : [];
  return {
    qty: lines.reduce((a,l)=>a+(Number(l.qty)||0),0),
    weight: lines.reduce((a,l)=>a+(Number(l.weight)||0),0)
  };
}

        <button class="btn danger sm" data-del-shipment-h="${sh.id}">${uiT('Удалить')}</button>
      </td>
    </tr>`;
  }).join('');

  return `
    <div class="toolbar">
      <div><h1>${uiT('История отгрузок')}</h1><div class="desc">${uiT('Все отгрузки и возможность их редактирования')}</div></div>

      : `<div class="empty"><div class="big">${uiT('Записей пока нет')}</div></div>`}</div>
    </div>

function bindShipmentHistoryEvents(){
  const q = document.getElementById('shipHistSearch');
  if(q) q.addEventListener('input', e=>{ shipmentHistorySearch = e.target.value; render(); setTimeout(()=>{ const i=document.getElementById('shipHistSearch'); if(i){ i.focus(); i.selectionStart=i.selectionEnd=i.value.length; } },0); });

async function saveEditedShipment(){
  const permit = state.permits.find(p=>p.id===editShipmentDraft.permitId);
  if(!permit){ toast('Разрешение не найдено'); return; }

  const lines = Object.entries(editShipmentDraft.lines)
    .map(([itemId,v])=>({itemId, qty:Number(v.qty), weight:Number(v.weight)}))
    .filter(l=>Number.isFinite(l.qty) && l.qty>0);

  if(!lines.length){ toast('Введите количество хотя бы по одной позиции'); return; }

  const errors = validateShipmentLines(permit, lines, editShipmentDraft.shipmentId);
  if(errors.length){
    toast('Отгрузка не сохранена: ' + errors[0]);
    alert('Отгрузка не может быть сохранена:\n\n' + errors.join('\n'));
    return;
  }

  const sh = state.shipments.find(s=>s.id===editShipmentDraft.shipmentId);
  if(!sh){ toast('Отгрузка не найдена'); return; }
  const oldSnapshot = JSON.parse(JSON.stringify(sh));
  sh.invoiceNumber = editShipmentDraft.invoiceNumber;
  sh.invoiceDate = editShipmentDraft.invoiceDate;
  sh.lines = lines;
  await saveShipments();
  await addAudit('shipment_update', 'shipment', sh.id, sh.invoiceNumber||sh.id, oldSnapshot, sh);
  editShipmentDraft = null;
  closeModal();
  render();
  toast(uiT('Отгрузка обновлена'));
}

function bindUploadEvents(){
  const dz = document.getElementById('dropzone');
  if(dz){
    const fileInput = document.getElementById('fileInput');
    dz.addEventListener('click', ()=>fileInput.click());
    fileInput.addEventListener('change', e=>{ if(e.target.files[0]) handleUploadFile(e.target.files[0]); });
    ['dragover','dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>e.preventDefault()));
    dz.addEventListener('dragover', ()=>dz.classList.add('drag'));
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{ dz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleUploadFile(e.dataTransfer.files[0]); });
  }
  const cancelBtn = document.getElementById('btnCancelUpload');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ uploadDraft=null; render(); });

  const doMatch = document.getElementById('btnDoMatch');
  if(doMatch) doMatch.addEventListener('click', ()=>{
    const nameIdx = Number(document.getElementById('mapName').value);
    const tnvedIdx = Number(document.getElementById('mapTnved').value);
    const qtyIdx = Number(document.getElementById('mapQty').value);
    const weightIdx = Number(document.getElementById('mapWeight').value);
    const permit = state.permits.find(p=>p.id===shipmentDraft.permitId);
    const matched = uploadDraft.dataRows.map(row=>{
      const rawName = row[nameIdx];
      const rawTnved = tnvedIdx>=0 ? row[tnvedIdx] : '';
      const qty = Number(row[qtyIdx])||0;
      const weight = weightIdx>=0 ? (Number(row[weightIdx])||0) : null;
      const match = matchItem(permit, rawName, rawTnved);
      return { rawName, rawTnved, qty, weight, itemId: match?match.id:(permit.items[0]?.id||''), autoMatched: !!match };
    }).filter(r=>r.qty>0 || (r.rawName && String(r.rawName).trim()!==''));
    uploadDraft.matched = matched;
    uploadDraft.step = 'preview';
    render();
  });

  document.querySelectorAll('[data-match-select]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      uploadDraft.matched[Number(sel.dataset.matchSelect)].itemId = sel.value;
      uploadDraft.matched[Number(sel.dataset.matchSelect)].autoMatched = true;
    });
  });

  const confirmBtn = document.getElementById('btnConfirmUpload');
  if(confirmBtn) confirmBtn.addEventListener('click', confirmUploadShipment);
}

function normalizeStr(s){ return String(s??'').toLowerCase().replace(/[^a-zа-я0-9]+/gi,' ').trim(); }

function matchItem(permit, rawName, rawTnved){
  const tnved = normalizeStr(rawTnved).replace(/\s+/g,'');
  if(tnved){
    const byCode = permit.items.find(it=>normalizeStr(it.tnved).replace(/\s+/g,'')===tnved);
    if(byCode) return byCode;
  }
  const name = normalizeStr(rawName);
  if(name){
    const exact = permit.items.find(it=>normalizeStr(it.name)===name);
    if(exact) return exact;
    // partial containment match
    const partial = permit.items.find(it=>{
      const n = normalizeStr(it.name);
      return n && (n.includes(name) || name.includes(n));
    });
    if(partial) return partial;
  }
  return null;
}

function handleUploadFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      // guess header row: first row with >=2 non-empty cells among first 15 rows
      let headerRowIndex = 0;
      for(let i=0;i<Math.min(15,rows.length);i++){
        const nonEmpty = rows[i].filter(c=>String(c).trim()!=='').length;
        if(nonEmpty>=2){ headerRowIndex = i; break; }
      }
      const headerRow = rows[headerRowIndex];
      const dataRows = rows.slice(headerRowIndex+1).filter(r=>r.some(c=>String(c).trim()!==''));
      uploadDraft = { fileName:file.name, headerRow, headerRowIndex, dataRows, step:'map' };

      // auto-guess column mapping after render, based on header text
      setTimeout(()=>{
        const guess = (keywords)=>{
          for(let i=0;i<headerRow.length;i++){
            const h = normalizeStr(headerRow[i]);
            if(keywords.some(k=>h.includes(k))) return i;
          }
          return 0;
        };
        const nameIdx = guess(['наимен','товар','артикул','name']);
        const tnvedIdx = guess(['тнвэд','тн вэд','код']);
        const qtyIdx = guess(['кол','шт','пар','qty']);
        const weightIdx = guess(['вес','кг','weight']);
        const setSel = (id,val)=>{ const el=document.getElementById(id); if(el) el.value = String(val); };
        setSel('mapName', nameIdx);
        setSel('mapTnved', tnvedIdx >= 0 ? tnvedIdx : -1);
        setSel('mapQty', qtyIdx);
        setSel('mapWeight', weightIdx >= 0 ? weightIdx : -1);
      },0);
      render();
    }catch(err){
      toast('Не удалось прочитать файл: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmUploadShipment(){
  const permit = state.permits.find(p=>p.id===shipmentDraft.permitId);
  if(!permit){ toast('Разрешение не найдено'); return; }

  const lines = uploadDraft.matched.filter(r=>Number(r.qty)>0).map(r=>{
    const it = permit.items.find(x=>x.id===r.itemId);
    let weight = r.weight;
    if(weight===null || !Number.isFinite(Number(weight))){
      const perUnit = it && Number(it.qty)>0 ? (Number(it.weight)||0)/Number(it.qty) : 0;
      weight = Number(r.qty) * perUnit;
    }
    return { itemId:r.itemId, qty:Number(r.qty), weight:Number(weight) };
  });

  if(!lines.length){ toast('Нет строк с количеством больше нуля'); return; }

  const errors = validateShipmentLines(permit, lines);
  if(errors.length){
    toast('Отгрузка не сохранена: ' + errors[0]);
    alert('Отгрузка из файла не может быть проведена:\n\n' + errors.join('\n'));
    return;
  }

  const newShipment = {
    id: uid('ship'), permitId: permit.id,
    invoiceNumber: shipmentDraft.invoiceNumber, invoiceDate: shipmentDraft.invoiceDate,
    lines
  };
  state.shipments.push(newShipment);
  await saveShipments();
  await addAudit('shipment_create', 'shipment', newShipment.id, newShipment.invoiceNumber||newShipment.id, null, newShipment);
  uploadDraft = null;
  shipmentDraft = { mode:'upload', permitId: permit.id, invoiceNumber:'', invoiceDate:'', lines:{} };
  render();
  toast('Отгрузка из файла проведена, остатки обновлены');
}

function exportWorkbook(){
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();
  function sheetName(base){
    let name = base.replace(/[\\/*?:\[\]]/g,'_').slice(0,31);
    let n=name, i=2;
    while(usedNames.has(n)){ n = (name.slice(0,28)+'_'+i); i++; }
    usedNames.add(n);
    return n;
  }

  for(const p of state.permits.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''))){
    const shipments = state.shipments.filter(s=>s.permitId===p.id)
      .sort((a,b)=>(a.invoiceDate||'').localeCompare(b.invoiceDate||''));

    const headerTitles = ['№','Наименование','Мато','Код ТН ВЭД','Количество разреш','Вес разрешение кг'];
    shipments.forEach(s=>{ headerTitles.push('Кол-во','Вес'); });
    headerTitles.push('Остаток количество','Остаток вес','Вес 1 единицы');

    const aoa = [];
    // row1: title
    const titleRow = new Array(headerTitles.length).fill('');
    titleRow[1] = `Разрешение №${escapeHtml(p.number)} от ${escapeHtml(p.date||'')}`;
    aoa.push(titleRow);
    // row2: invoice labels
    const invRow = new Array(headerTitles.length).fill('');
    let c = 6;
    shipments.forEach(s=>{ invRow[c] = `${s.invoiceNumber||''} от ${s.invoiceDate||''}`; c+=2; });
    aoa.push(invRow);
    // row3: column headers
    aoa.push(headerTitles);
    // item rows
    p.items.forEach((it,idx)=>{
      const row = [idx+1, it.name, it.material||'', it.tnved, it.qty, it.weight];
      shipments.forEach(s=>{
        const line = s.lines.find(l=>l.itemId===it.id);
        row.push(line?line.qty:'', line?Number(line.weight).toFixed(3)*1:'');
      });
      const used = itemUsage(p.id, it.id);
      const st = itemStatus(it, used);
      row.push(st.remQty, Number(st.remWeight.toFixed(3)), it.qty? Number((it.weight/it.qty).toFixed(6)):'');
      aoa.push(row);
    });
    // totals row
    const totals = ['', 'Итого', '', '', p.items.reduce((a,it)=>a+(Number(it.qty)||0),0), p.items.reduce((a,it)=>a+(Number(it.weight)||0),0)];
    shipments.forEach(s=>{
      const qtySum = s.lines.reduce((a,l)=>a+(Number(l.qty)||0),0);
      const wSum = s.lines.reduce((a,l)=>a+(Number(l.weight)||0),0);
      totals.push(qtySum, Number(wSum.toFixed(3)));
    });
    const t = permitTotals(p);
    totals.push(t.remQty, Number(t.remW.toFixed(3)), '');
    aoa.push(totals);

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const merges = [{s:{r:0,c:1},e:{r:0,c:headerTitles.length-1}}];
    let cc=5;
    shipments.forEach(()=>{ merges.push({s:{r:1,c:cc},e:{r:1,c:cc+1}}); cc+=2; });
    ws['!merges'] = merges;
    ws['!cols'] = headerTitles.map((_,i)=> i===1 ? {wch:38} : {wch:14});
    XLSX.utils.book_append_sheet(wb, ws, sheetName(p.number));
  }

  XLSX.writeFile(wb, 'Разрешения_учет.xlsx');
  toast('Файл сформирован');
}

  showModal(`
    <div class="modal-head"><h2>Вход для редактирования</h2><button class="close-x" data-close>&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Email</label><input type="email" id="authEmail" autocomplete="username" placeholder="name@company.uz"></div>
      <div class="field"><label>Пароль</label><input type="password" id="authPassword" autocomplete="current-password" placeholder="Пароль"></div>
      <div class="subtle-note">Просматривать данные можно без входа. Вход нужен, чтобы локальные изменения попали в общую базу.</div>
    </div>
    <div class="modal-foot"><button class="btn secondary" data-close>Отмена</button><button class="btn" id="btnLogin">Войти</button></div>
  `);
  document.getElementById('btnLogin').addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!email || !password){ toast('Введите email и пароль'); return; }
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Вход…';
    try{
      await OfflineSync.login(email,password);
      closeModal();
      await refreshAuthButton();
      toast('Вход выполнен, синхронизация запущена');
    }catch(err){
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Войти';
      toast(err.message || 'Не удалось войти');
    }
  });
}

function bindAuthButton(){
  const btn = document.getElementById('authBtn');
  if(btn) btn.addEventListener('click', openAuthModal);
  refreshAuthButton();
}

/* ============================= UTIL ============================= */
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ============================= DATA SAFETY / MIGRATION ============================= */
/*
  Production build: no hard-coded permit data is injected into the user's database.
  Older versions of the app seeded demo/preset permits automatically. We deliberately
  keep the migration helpers below only for deduplicating already-existing records.
*/
async function dedupePermitsByNumber(){
  const byNumber = new Map();
  state.permits.forEach(p=>{
    const key = String(p.number||'').trim();
    if(!key) return;
    if(!byNumber.has(key)) byNumber.set(key, []);
    byNumber.get(key).push(p);
  });
  let changed = false;
  byNumber.forEach(list=>{
    if(list.length < 2) return;
    const withShipments = list.find(p => state.shipments.some(s=>s.permitId===p.id));
    const keeper = withShipments || list[0];
    list.forEach(p=>{
      if(p.id === keeper.id) return;
      state.permits = state.permits.filter(x=>x.id!==p.id);
      state.shipments = state.shipments.filter(s=>s.permitId!==p.id);
      changed = true;
    });
  });
  if(changed){
    await savePermits();
    await saveShipments();
  }
}

/* ============================= INIT ============================= */
(async function init(){
  OfflineSync.onStatus(({kind,message})=>setSyncPill(kind,message));
  OfflineSync.onData(async ()=>{
    const next = await OfflineSync.loadState();
    state = { permits:[], shipments:[], audits:[], ...(next||{}) };
    render();
  });

  await OfflineSync.start();
  await loadState();

  // Sync poygasi (race) natijasida bir xil raqamli ruxsatnoma ikki nusxada
  // paydo bo'lgan bo'lsa, uni bittaga birlashtiramiz.
  await dedupePermitsByNumber();

  // Presetlardagi ruxsatnomalarni doim tekshiramiz: mavjud (number bo'yicha)
  // bo'lsa tegilmaydi, kodda yangi qo'shilgan preset bo'lsa, u avtomatik qo'shiladi.

  // Seed'dan keyin ham, ehtiyot uchun, yana bir bor tekshiramiz.
  await dedupePermitsByNumber();

  render();
  bindAuthButton();

  if('serviceWorker' in navigator){
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(refreshing) return;
      refreshing = true;
      location.reload();
    });
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('SW registration failed',err));
  }
})();
</script>
